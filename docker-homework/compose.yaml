services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: docker123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d course_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: course_db
      DB_USER: student
      DB_PASSWORD: docker123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data: