
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>會員登入 - 即時聊天平台</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
            background: #2b2d31;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px #0005;
        }

        .auth-box h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .auth-box p {
            text-align: center;
            color: #b5bac1;
            margin-bottom: 25px;
        }

        .auth-box label {
            display: block;
            margin: 15px 0 8px;
            font-size: 14px;
        }

        .auth-box input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1e1f22;
            color: white;
            font-size: 15px;
        }

        .auth-button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .auth-button:hover {
            background: #4752c4;
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: #b5bac1;
        }

        .switch-auth a {
            color: #8ea1ff;
            cursor: pointer;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        .error-message {
            color: #ff7777;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="auth-page">
    <div class="auth-box">

        <h1>💬 即時聊天平台</h1>
        <p>歡迎使用社群聊天系統</p>

        <!-- 登入表單 -->
        <form id="loginForm">

            <h2>會員登入</h2>

            <label for="loginUsername">帳號</label>
            <input
                id="loginUsername"
                type="text"
                placeholder="請輸入帳號"
                required
            >

            <label for="loginPassword">密碼</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="請輸入密碼"
                required
            >

            <button class="auth-button" type="submit">
                登入
            </button>

            <div class="switch-auth">
                還沒有帳號？
                <a id="showRegister" href="#">立即註冊</a>
            </div>
        </form>

        <!-- 註冊表單 -->
        <form id="registerForm" class="hidden">

            <h2>會員註冊</h2>

            <label for="registerUsername">帳號</label>
            <input
                id="registerUsername"
                type="text"
                placeholder="建立帳號"
                required
            >

            <label for="registerPassword">密碼</label>
            <input
                id="registerPassword"
                type="password"
                placeholder="建立密碼"
                minlength="8"
                required
            >

            <label for="confirmPassword">確認密碼</label>
            <input
                id="confirmPassword"
                type="password"
                placeholder="再次輸入密碼"
                required
            >

            <button class="auth-button" type="submit">
                註冊
            </button>

            <div class="switch-auth">
                已經有帳號？
                <a id="showLogin" href="#">返回登入</a>
            </div>
        </form>

        <div id="authMessage"
             class="error-message"
             role="status"></div>

    </div>
</div>

<script src="auth.js"></script>

</body>
</html>
